whatsnew:function(){return '<h1 tabindex="-1">What’s New</h1><ul><li>Casino: two prize wheels for the scary modes. The Nightmare Wheel only awards Nightmare power-ups and the Labyrinth Wheel only awards Labyrinth power-ups, so the item pools stay completely separate. One free spin per wheel each day.</li><li>The Labyrinth of Dread is now easier: a slower pace, Mister Grin starts farther back and closes in more slowly, walls and ambushes cost less, and the maze has fewer junctions, dead ends and barriers.</li><li>New mode, The Labyrinth of Dread, right below Nightmare: an endless maze chase with Mister Grin, corner ambushes, dead-end hallucinations, and four exclusive power-ups: Phantom Compass, Decoy Flare, Wall Phase and Adrenaline Burst.</li><li>The Pogo Stick has been removed from the regular modes. If you had bought one, your 70 coins were refunded.</li><li>Nightmare Mode has just one enemy, Mister Grin. Ask the Coach is now only for the regular modes and is hidden in Nightmare.</li><li>Nightmare Mode is now completely separate: no trains, bouncy trains, speed pads, events or regular power-ups there, only foot running with crate walls and its own six power-ups. The regular modes never show the Nightmare power-ups.</li><li>Nightmare power-ups: in Nightmare Mode only, the Coin Magnet becomes the Whispering Balloon, the Score Booster becomes the Fear Meter, and Dash becomes Panic Sprint. Three rare new pickups help you survive Mister Grin: Spotlight Flash, Toy Boat Shield and Shadow Slide.</li><li>Nightmare Mode, right below Hard: a dark, high-stakes chase with its own eerie sound themes. Mister Grin, a clown with a machete, never stops chasing you. There are no lives, a stumble lets him catch up, and coins are worth double.</li><li>The Trials screen now shows a progress bar for every trial: your best attempt against the goal, plus the stars you have earned.</li><li>Trials now show a live progress bar during a run, with your goal progress and a second thin bar for the steps left. It appears only in trials.</li><li>Trials Mode: five short, objective-based runs on the home screen, such as Coin Dash and Smash Course. Earn up to three stars on each, separate from your missions.</li><li>Two new players: Orion, whose power-ups last half again as long, and Lyra, who is safe for three steps after a crash.</li><li>Three players to choose from on the new Players screen: Nova, Kestrel and Bruno. Each has a perk, a voice pitch and a start jingle.</li><li>Ask the Coach is back as a full-width button under the controls with VoiceOver on, in every mode.</li><li>Ask the Coach: the Ask screen no longer reads out the AI status by itself, and the microphone ignores the game’s own cue words.</li><li>New Game announcements setting: turns off the spoken pickups, crashes and stage themes during a run while keeping the Jump, Roll, Left and Right cues.</li><li>Audio Decoy: a tactical power-up that plants a false sound in a lane next to you and lures the hazards in your lane over to it. The voice tells you which side. Stay out of that lane until it ends.</li><li>New seasonal event: Harvest Fair, with warm market sounds and more Coin Magnets.</li><li>Two new seasonal events: Spring Bloom Festival, with more Purple Herbs, and Fireworks Night, with more Dash power-ups. Each has its own sound theme and joins the weekly rotation.</li><li>Purple Herb and Dash power-ups: the Purple Herb heals one life, or gives 10 coins if your lives are full. Dash bursts you forward at triple score through everything and collects coins from every lane.</li><li>Endless Mode: pick Endless on the home screen. There is no finish line. The track is built as you run, and the speed and number of hazards rise the longer you survive. Your score is the distance you cover, in meters.</li><li>Stomp Attack power-up: press Jump to slam the ground and smash every train and barrier close to you for 3 coins each. You get 3 stomps, and the voice says Stomp when one is in range. Also in the Mini Shop.</li><li>Battery power-up: charges your hoverboard with 20 more steps and one extra hit. If you have no hoverboard, it is saved for the next one. You can also buy it in the Mini Shop.</li><li>Ask the Coach now shows whether the AI is on, and has buttons to allow it or open its permissions.</li><li>Speed pads: a rising whoosh is a speed pad that makes you dash through everything at triple score.</li><li>Online backup: for players signed in to Claude with Contributor access, progress is also backed up online, so it survives app updates and clearing the phone’s browser data.</li><li>Bouncy trains: a springy boing means a safe train. Stay in its lane to bounce over it and earn 5 coins. The voice says Bounce.</li><li>Set your own username in Settings. It shows on the home screen and in the welcome greeting.</li><li>Mini Shop on the home screen: spend coins on power-ups and an extra life that start your next run.</li><li>Automatic saving: your coins, level, best score, missions and event progress save by themselves, even if you close the app mid-run.</li><li>Ask the Coach works during a run with VoiceOver on or off. With VoiceOver on, use the Ask the Coach button under the controls. With it off, tap Ask at the top of the screen. Say your question or tap a quick question like Where am I.</li><li>Quick pause and resume with VoiceOver off: a big Pause button, tap anywhere to resume, and the game pauses by itself if you leave the app.</li><li>Ask the Coach: ask a spoken question about your current city, hazards or power-ups and hear a short answer.</li><li>City Event: a world tour of 22 cities. Each stage is a new city with its own music, announced by voice.</li><li>Practice Sound Room: press a sound to hear its name, then the sound. It covers power-ups, the security guard and his dog.</li><li>Weekly events with event tokens and a reward track.</li><li>With VoiceOver off: spoken cues for Jump, Roll, Left and Right, instant spoken confirmations, and tap anywhere to play again.</li><li>More lives: 5 on Easy, 4 on Medium and 3 on Hard. Zen has unlimited lives.</li></ul>'+b('go','settings','Back to settings');},

how:function(){var a=['Wear headphones. Obstacles come toward you in three lanes: left, middle and right. Their sounds pan to that side and get louder as they get close.','A low rumble is a train. Move to another lane.','A springy boing over a rumble is a bouncy train. It is safe: you bounce over it and earn 5 coins.','A rising whoosh is a speed pad. Run over it to dash at triple score through everything for a few steps. The voice says Speed.','Two low beeps are a low barrier. Press Jump.','A high whistle is an overhead bar. Press Roll.','A chime means a coin in that lane. A bell ring means an event token. A rising sparkle means a power-up. Be in the lane to collect it.','The voice coach says Jump, Roll, Left or Right a few steps before an obstacle reaches you. Turn it off in Settings.','Status reads your lane, score, coins and active power-ups. Pause stops the run. With VoiceOver off, Status and Pause are the buttons at the top of the screen.','Casino: open the Casino on the home screen for two prize wheels. The Nightmare Wheel only gives Nightmare power-ups, and the Labyrinth Wheel only gives Labyrinth of Dread power-ups. You get one free spin per wheel each day, then spins cost 100 coins. Prizes show up as pickups early in your next run of that mode.','Trials are short runs with one objective, separate from your missions. Open Trials on the home screen, finish faster for up to three stars, and earn coins for each new star.','Choose your player on the Players screen. Nova has steady hands, Kestrel collects coins from nearby lanes, Bruno starts every run with a shield, Orion makes power-ups last longer, and Lyra is safe for a few steps after a crash. Each has their own voice pitch and start jingle.','The Labyrinth of Dread: an endless maze right below Nightmare. You run forward nonstop while Mister Grin hunts you. At every junction, take the open lane: lanes with walls creak, and the open lane is silent. Beware: some openings are dead ends that seal shut, where he appears as a hallucination and the voice says Switch lanes. He also ambushes from corners, so listen for Ambush and move away. Coins work as usual. There are no trains and no regular power-ups, only the Phantom Compass, Decoy Flare, Wall Phase and Adrenaline Burst.','Nightmare Mode: a separate, high-stakes mode right below Hard. Mister Grin, a clown with a machete, chases you the whole way. You have no lives. The bar and the voice tell you how many steps behind you he is. A stumble lets him gain three steps, and if he reaches you the run is over. Coins and dodged obstacles push him back. This mode is foot running only, with no trains, vehicles, events or regular power-ups. Blocked lanes are walls of crates. The only power-ups are the Whispering Balloon, Fear Meter and Panic Sprint, plus the rare Spotlight Flash, Toy Boat Shield and Shadow Slide. Coins are worth double. Mister Grin is the only enemy here, and Ask the Coach is only for the regular modes.','Easy: slow with five lives. Medium: normal with four lives. Hard: fast with three lives. Zen: no crashes, just calm running. Endless: no finish line. The track is built as you run and gets faster and busier the longer you survive, with three lives. Your score is the distance you cover. Use Pause then End run to finish.'],k,h='<h1 tabindex="-1">How to Play</h1><ul>',i;for(i=0;i<a.length;i++)h+='<li>'+a[i]+'</li>';h+='</ul><h2>Power-ups</h2><ul>';for(k in PW)h+='<li>'+PW[k].n+': '+PW[k].s+'</li>';return h+'</ul>'+BK;},
